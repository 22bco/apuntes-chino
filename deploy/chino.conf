server {
    listen 80;
    listen [::]:80;
    server_name chino.basti.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://chino.basti.cl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chino.basti.cl;

    # Certificado gestionado por certbot (renovado por /opt/renovar_certificados.sh)
    ssl_certificate     /etc/letsencrypt/live/chino.basti.cl-new/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chino.basti.cl-new/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    real_ip_header CF-Connecting-IP;

    root /usr/share/nginx/html/static/chino;
    index index.html;

    # Headers de seguridad (se repiten en cada location que agrega headers,
    # porque add_header en un location anula los del server)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── API de pizarras por curso (contenedor chino_api, ver api/README.md) ──
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $chino_api chino_api;
        proxy_pass http://$chino_api:5020;  # sin URI: con variable, nginx mandaria "/api/" literal
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 10m;
    }

    # Recursos estáticos pesados: caché 7 días
    location ~* \.(css|js|woff2?|ttf|mp3|png|jpe?g|gif|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # HTML y JSON: siempre revalidar (los apuntes cambian cada sábado)
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
