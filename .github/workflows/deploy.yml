name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            git pull origin main
            rsync -a --delete /opt/apuntes-chino/chino/ /opt/TransportesMarDelSur/static/chino/
            cd /opt/apuntes-chino/api && docker compose up -d --build --remove-orphans
      - name: Verificar sitio y API
        run: |
          curl -fsS -A "Mozilla/5.0 (deploy-check)" https://chino.basti.cl/ -o /dev/null
          curl -fsS -A "Mozilla/5.0 (deploy-check)" https://chino.basti.cl/api/health
